user  root;
worker_processes  auto;

events {}

http {
    upstream client { server client:3002; }
    upstream api { server server:5002; }

    upstream client_mansion { server frontend:3000; }
    upstream api_mansion { server backend:5000; }

    # --- First server block: HTTP (port 90) ---
    server {
        listen 90;
        server_name ecom.mansion.com;

        client_max_body_size 20M;

        location /.well-known/acme-challenge/ {
            root /home/ubuntu/config/html;
        }

        location / {
            proxy_pass http://client;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
            proxy_set_header Host $host;
            proxy_cache_bypass $http_upgrade;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            client_max_body_size 20M;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        location /uploads/ {
            proxy_pass http://api/uploads/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /health {
            access_log off;
            proxy_pass http://api/api/health;
        }
    }

    # --- First server block: HTTPS (port 443) ---
     server {
         listen 443 ssl;
         server_name ecom.mansion.com;

         ssl_certificate /etc/letsencrypt/live/gnanabi.info/fullchain.pem;
         ssl_certificate_key /etc/letsencrypt/live/gnanabi.info/privkey.pem;

         client_max_body_size 20M;

         location / {
             proxy_pass http://client;
             proxy_http_version 1.1;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection 'upgrade';
             proxy_set_header Host $host;
             proxy_cache_bypass $http_upgrade;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
         }

         location /api/ {
             proxy_pass http://api/api/;
             proxy_http_version 1.1;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             proxy_set_header X-Forwarded-Proto $scheme;
             client_max_body_size 20M;
             proxy_set_header Upgrade $http_upgrade;
             proxy_set_header Connection 'upgrade';
         }

         location /uploads/ {
             proxy_pass http://api/uploads/;
             proxy_http_version 1.1;
             proxy_set_header Host $host;
             proxy_set_header X-Real-IP $remote_addr;
             proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
             expires 30d;
             add_header Cache-Control "public, immutable";
         }
         location /health {
             access_log off;
             proxy_pass http://api/api/health;
         }
     }

   server {
	listen 90;
	server_name www.mansion.gnanabi.info;
	return 301 https://mansion.gnanabi.info$request_uri;
     }

    # --- Second server block: HTTP (port 90) ---
    server {
        listen 90;
        server_name 68.233.119.219 mansion.gnanabi.info;

        client_max_body_size 500M;

        location /.well-known/acme-challenge/ {
            alias /home/ubuntu/config/html/.well-known/acme-challenge/;
        }

        location / {
            proxy_pass http://client_mansion;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_mansion/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/complains/ {
            proxy_pass http://api_mansion/api/complains/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

        location /health {
            access_log off;
            proxy_pass http://api_mansion/api/health;
        }
    }

    # --- Second server block: HTTPS (port 443) ---
    server {
        listen 443 ssl;
        server_name mansion.gnanabi.info www.mansion.gnanabi.info;

        ssl_certificate /etc/letsencrypt/live/mansion.gnanabi.info/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/mansion.gnanabi.info/privkey.pem;

        client_max_body_size 500M;

        location / {
            proxy_pass http://client_mansion;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
        }

        location /api/ {
            proxy_pass http://api_mansion/api/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
	    client_max_body_size 500M;
	    proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection 'upgrade';
        }

        location /api/complains/ {
            proxy_pass http://api_mansion/api/complains/;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            expires 30d;
            add_header Cache-Control "public, immutable";
        }

	 # Uploaded files (images, documents, etc)
        location /daily-status-media/ {
                proxy_pass http://api_mansion/api/daily-status-media/;
                proxy_http_version 1.1;
                proxy_set_header Host $host;
                proxy_set_header X-Real-IP $remote_addr;
                proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

                # Cache images for 30 days
                expires 30d;
                add_header Cache-Control "public, immutable";
        }        
       
	 location /health {
            access_log off;
            proxy_pass http://api_mansion/api/health;
        }
    }
}
