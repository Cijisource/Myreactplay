services:
  db:
    image: postgres:16-alpine
    container_name: blynk-db
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 100m
    environment:
      POSTGRES_DB: blynkdb
      POSTGRES_USER: blynk
      POSTGRES_PASSWORD: blynkpass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  app:
    # build: .
    image: 555cijaiz555/backsync:v1
    container_name: blynk-fetcher
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 100m
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: blynkdb
      DB_USER: blynk
      DB_PASSWORD: blynkpass
      FETCH_INTERVAL_SECONDS: 60
    env_file:
      - .env
    volumes:
      - app_config:/data

  dashboard:
    # build:
    #   context: .
    #   dockerfile: Dockerfile.streamlit
    image: 555cijaiz555/backsyncdash:v1
    container_name: blynk-dashboard
    restart: unless-stopped
    cpus: 0.2
    mem_limit: 100m
    depends_on:
      - db
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_NAME: blynkdb
      DB_USER: blynk
      DB_PASSWORD: blynkpass
    ports:
      - "8501:8501"
    env_file:
      - .env
    volumes:
      - app_config:/data
      - /var/run/docker.sock:/var/run/docker.sock

volumes:
  postgres_data:
  app_config:
